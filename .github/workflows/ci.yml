name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest --cov=cancerbero --cov-report=term-missing

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build
      - run: python -m build
      - name: Enforce lightweight core
        shell: bash
        run: |
          wheel_bytes=$(stat -c %s dist/*.whl)
          echo "wheel_bytes=${wheel_bytes}"
          test "${wheel_bytes}" -lt 20971520
          python - <<'PY'
          import pathlib, zipfile
          wheel = next(pathlib.Path("dist").glob("*.whl"))
          with zipfile.ZipFile(wheel) as archive:
              metadata = archive.read(next(n for n in archive.namelist() if n.endswith("METADATA"))).decode()
          forbidden = ("torch", "transformers", "tensorflow", "jax")
          assert not any(f"Requires-Dist: {name}" in metadata for name in forbidden)
          print(metadata)
          PY
